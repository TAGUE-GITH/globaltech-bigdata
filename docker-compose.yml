# Cluster Hadoop du projet GlobalTech Industries
# Étape 1 : HDFS (1 NameNode, 3 DataNodes)
# Étape 2 : YARN (1 ResourceManager, 2 NodeManagers)
# Étape 3 : Spark 3.5 (History Server et poste client)
# Lot 2   : données HDFS conservées dans des volumes Docker
# Image officielle Apache, même version que les TP : Hadoop 3.5.0

x-hadoop: &hadoop
  image: apache/hadoop:3.5.0
  env_file: ./hadoop.env
  restart: unless-stopped

# Services HDFS : l'image officielle plus les dossiers de stockage
# appartenant à l'utilisateur hadoop (voir docker/hadoop/Dockerfile)
x-hdfs: &hdfs
  <<: *hadoop
  image: globaltech/hadoop:3.5.0
  build: ./docker/hadoop

services:

  # Le chef de HDFS : il sait où se trouve chaque bloc de chaque fichier
  namenode:
    <<: *hdfs
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      # Au tout premier démarrage, ce dossier n'existe pas : HDFS est formaté.
      # Ensuite, il est dans le volume : HDFS repart avec ses données.
      ENSURE_NAMENODE_DIR: /data/namenode/current
    ports:
      - "9870:9870"   # interface web de HDFS
    volumes:
      - hdfs-namenode:/data/namenode
      - ./data:/opt/project/data:ro
      - ./src:/opt/project/src
      - ./conf:/opt/project/conf

  # Les disques : ils stockent réellement les blocs
  datanode1:
    <<: *hdfs
    container_name: datanode1
    hostname: datanode1
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    volumes:
      - hdfs-datanode1:/data/datanode

  datanode2:
    <<: *hdfs
    container_name: datanode2
    hostname: datanode2
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    volumes:
      - hdfs-datanode2:/data/datanode

  datanode3:
    <<: *hdfs
    container_name: datanode3
    hostname: datanode3
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    volumes:
      - hdfs-datanode3:/data/datanode

  # Le chef de YARN : il distribue la mémoire et les cœurs aux traitements
  resourcemanager:
    <<: *hadoop
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    depends_on: [namenode]
    ports:
      - "8088:8088"   # interface web de YARN

  # Les ouvriers de YARN : ils exécutent les traitements
  nodemanager1:
    <<: *hadoop
    container_name: nodemanager1
    hostname: nodemanager1
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]

  nodemanager2:
    <<: *hadoop
    container_name: nodemanager2
    hostname: nodemanager2
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]

  # L'historique des traitements Spark terminés
  spark-history:
    <<: *hadoop
    image: globaltech/spark:3.5.9
    build: ./docker/spark
    container_name: spark-history
    hostname: spark-history
    # Crée le dossier des journaux dans HDFS s'il manque, puis lance le serveur
    command: ["bash", "-c", "hdfs dfs -mkdir -p /spark-logs && hdfs dfs -chmod 1777 /spark-logs && exec spark-class org.apache.spark.deploy.history.HistoryServer"]
    environment:
      WAITFOR: namenode:8020
    depends_on: [namenode]
    ports:
      - "18080:18080" # interface web du Spark History Server

  # Le poste client : c'est d'ici que l'on lance les traitements avec spark-submit
  spark-client:
    <<: *hadoop
    image: globaltech/spark:3.5.9
    build: ./docker/spark
    container_name: spark-client
    hostname: spark-client
    command: ["sleep", "infinity"]
    depends_on: [resourcemanager, spark-history]
    ports:
      - "4040:4040"   # interface web du traitement Spark en cours
    volumes:
      - ./data:/opt/project/data:ro
      - ./src:/opt/project/src
      - ./conf:/opt/project/conf
      - ./tools:/opt/project/tools

# Volumes Docker : les données de HDFS survivent à « docker compose down ».
# Seul « docker compose down -v » les efface.
volumes:
  hdfs-namenode:
  hdfs-datanode1:
  hdfs-datanode2:
  hdfs-datanode3:
