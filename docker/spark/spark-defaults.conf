# Réglages Spark appliqués à chaque spark-submit et pyspark

# Les traitements s'exécutent sur YARN (exigence de l'énoncé), pas en local
spark.master                      yarn
spark.submit.deployMode           client

# Historique : chaque traitement écrit son journal dans HDFS,
# le Spark History Server le relit pour l'afficher sur le port 18080
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory     hdfs://namenode:8020/spark-logs
spark.yarn.historyServer.address  spark-history:18080

# Taille des exécuteurs : 1 Go et 1 cœur chacun, 2 exécuteurs par défaut.
# Un exécuteur occupe 1 Go + 384 Mo de marge, arrondi à 1,5 Go par YARN :
# les 8 Go des deux NodeManagers en accueillent jusqu'à 5 en plus du pilote.
spark.executor.memory             1g
spark.executor.cores              1
spark.executor.instances          2

# Même Python partout : celui de l'image Hadoop (3.12)
spark.pyspark.python              python3
spark.pyspark.driver.python       python3
